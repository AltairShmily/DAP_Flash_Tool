name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.47.x'
  PYTHON_VERSION: '3.11'

jobs:
  # ─── Python 后端测试 ───
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Generate gRPC code
        run: |
          mkdir -p backend/proto
          python -m grpc_tools.protoc \
            -I proto \
            --python_out=backend/proto \
            --grpc_python_out=backend/proto \
            proto/dap_flash.proto
          touch backend/proto/__init__.py
          sed -i 's/^import dap_flash_pb2/from . import dap_flash_pb2/' backend/proto/dap_flash_pb2_grpc.py

      - name: Verify committed proto code is in sync
        run: |
          git diff --exit-code -- backend/proto || {
            echo "::error::Committed Python proto code is stale — regenerate and commit (see scripts/setup_dev.bat)"
            exit 1
          }

      - name: Run tests
        working-directory: backend
        run: |
          python test_import.py
          python test_parsers.py
          python test_pack.py
          pip install pytest
          pytest test_drivers.py test_flash_service.py -v

      - name: Verify server starts and binds
        working-directory: backend
        run: |
          python server.py 50099 > server.log 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 20); do
            grep -q "^READY" server.log && break
            sleep 0.5
          done
          if ! grep -q "^READY 50099" server.log; then
            echo "::error::server did not report READY"
            cat server.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          python -c "import socket; socket.create_connection(('127.0.0.1', 50099), timeout=5).close(); print('server port reachable')"
          kill $SERVER_PID

  # ─── Flutter 分析 + Linux 构建 ───
  flutter-analyze:
    name: Flutter Analyze + Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install protoc + Linux build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libgtk-3-dev

      - name: Install protoc Dart plugin
        run: dart pub global activate protoc_plugin 22.5.0

      - name: Generate Dart proto stubs
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          protoc \
            --proto_path=proto \
            --dart_out=grpc:flutter_app/lib/proto \
            proto/dap_flash.proto

      - name: Verify committed Dart proto code is in sync
        run: |
          git diff --exit-code -- flutter_app/lib/proto || {
            echo "::error::Committed Dart proto code is stale — regenerate with protoc_plugin 22.5.0 and commit"
            exit 1
          }

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: flutter_app
        run: flutter test

      - name: Build Linux
        working-directory: flutter_app
        run: flutter build linux --release

  # ─── Windows 构建（含 PyInstaller 后端打包） ───
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: [python-test, flutter-analyze]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install protoc
        shell: bash
        run: choco install protoc --version=25.1 -y

      - name: Install protoc Dart plugin
        shell: bash
        run: dart pub global activate protoc_plugin 22.5.0

      # ── Python backend: generate gRPC + build standalone exe ──
      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Generate Python gRPC code
        shell: bash
        run: |
          mkdir -p backend/proto
          python -m grpc_tools.protoc \
            -I proto \
            --python_out=backend/proto \
            --grpc_python_out=backend/proto \
            proto/dap_flash.proto
          touch backend/proto/__init__.py
          sed -i 's/^import dap_flash_pb2/from . import dap_flash_pb2/' backend/proto/dap_flash_pb2_grpc.py

      - name: Build backend standalone exe (PyInstaller)
        working-directory: backend
        run: pyinstaller server.spec --noconfirm --clean

      # ── Flutter frontend ──
      - name: Generate Dart proto stubs
        shell: bash
        run: |
          export PATH="$PATH:$USERPROFILE/AppData/Local/Pub/Cache/bin"
          protoc \
            --proto_path=proto \
            --dart_out=grpc:flutter_app/lib/proto \
            proto/dap_flash.proto

      # Windows 平台文件已提交（含 bitsdojo_window main.cpp 配置），无需重新生成

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Windows
        working-directory: flutter_app
        run: flutter build windows --release

      # ── Bundle: Flutter app + standalone backend ──
      - name: Assemble distribution
        shell: bash
        run: |
          mkdir -p dist
          cp -r flutter_app/build/windows/x64/runner/Release/* dist/
          mkdir -p dist/backend
          cp backend/dist/server.exe dist/backend/server.exe
          echo "Distribution assembled:"
          ls -la dist/
          ls -la dist/backend/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dap-flash-tool-windows
          path: dist/
          retention-days: 7
